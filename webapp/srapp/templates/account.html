{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="page-head"><div><h1>My account</h1><p class="sub">{{ me.username }} · role <b>{{ me.role }}</b></p></div></div>
<form class="panel" method="post" style="max-width:480px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h2>Change password</h2>
  <div class="field"><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></div>
  <div class="field"><label>New password</label><input type="password" name="new" required minlength="10" autocomplete="new-password"><div class="hint">Minimum 10 characters.</div></div>
  <div class="field"><label>Repeat new password</label><input type="password" name="confirm" required minlength="10" autocomplete="new-password"></div>
  <button class="btn primary">Update password</button>
</form>
{% endblock %}
