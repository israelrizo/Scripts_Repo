{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login">
    <picture><source srcset="{{ url_for('static', filename='brand/logo-dark.svg') }}" media="(prefers-color-scheme: dark)"><img class="login-logo" src="{{ url_for('static', filename='brand/logo.svg') }}" alt="JMeter Control Center"></picture>
    {% if no_users %}
      <div class="panel">
        <h2>No users configured</h2>
        <p class="sub">Create the first administrator on the Master, then reload:</p>
        <pre class="console" style="height:auto">cd webapp
./.venv/bin/python manage_users.py add admin --role admin</pre>
      </div>
    {% else %}
      <form class="panel" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label for="u">Username</label><input id="u" type="text" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
        <button class="btn primary" style="width:100%;justify-content:center">Sign in</button>
      </form>
    {% endif %}
  </div>
</div>
{% endblock %}
