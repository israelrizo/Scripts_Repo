<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="JMeter Control Center">
  <title>JMeter Control Center · Google Chat webhook</title>
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#46557A"/>
      <stop offset="1" stop-color="#2A3450"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- the Control Center mark (orange, khaki, white), kept inside the circle crop of Chat avatars -->
  <g stroke-linejoin="round" stroke-width="5" transform="translate(113 70) scale(4.6)">
    <path d="M34 7 L57 30 L26 39 Z" fill="#EE9A3A" stroke="#EE9A3A"/>
    <path d="M25 15 L50 43 L15 47 Z" fill="#A59F80" stroke="#A59F80"/>
    <path d="M27 24 L49 58 L5 58 Z" fill="#FFFFFF" stroke="#FFFFFF"/>
  </g>
  <!-- live pulse: a small performance trace under the mark -->
  <polyline points="158,404 212,404 230,374 252,432 274,388 292,404 354,404" fill="none" stroke="#EE9A3A"
            stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
